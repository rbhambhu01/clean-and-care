# Render Blueprint — deploys the backend API as a free Node web service.
# In Render: New -> Blueprint -> pick this repo -> it reads this file automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: clean-and-care-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # set this yourself in the Render dashboard after first deploy
      - key: CLIENT_ORIGIN
        sync: false # set to your GitHub Pages origin, e.g. https://rbhambhu01.github.io
      # Offer-banner image uploads go to Cloudinary (free tier), not our own
      # ephemeral filesystem — see DEPLOYMENT.md "Offer banner image" section
      # for how to get these three values.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    # NOTE: Render's free tier doesn't support persistent disks, so this service
    # has no disk mount. backend/data/db.json therefore resets to the seeded
    # content on every deploy (and possibly other restarts) — fine for
    # services/pricing/testimonials (reseeded each time anyway), but contact
    # form and pickup-request submissions will NOT reliably persist. See
    # DEPLOYMENT.md for options if you need real lead persistence.
