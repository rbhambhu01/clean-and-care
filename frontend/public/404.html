<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clean &amp; Care</title>
    <!--
      GitHub Pages has no server-side router, so a direct hit on e.g.
      /clean-and-care/pricing 404s. This redirects that into a query string
      that index.html decodes back into the real path before React Router
      mounts. Standard technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // "/clean-and-care"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
